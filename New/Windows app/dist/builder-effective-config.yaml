directories:
  output: dist
  buildResources: build
appId: com.quark.launcher
productName: Quark Launcher
publish:
  - provider: github
    owner: c14b7
    repo: Quark-Launcher
files:
  - filter:
      - main.js
      - preload.js
      - store-api.js
      - media-smtc.js
      - minecraft-detect.js
      - overlay-manager.js
      - overlay-performance.js
      - overlay-defaults.json
      - overlay.html
      - overlay.css
      - overlay-renderer.js
      - overlay-preload.js
      - dev-app-update.yml
      - assets/**/*
      - package.json
extraResources:
  - from: ../web/act-l/out
    to: app
    filter:
      - '**/*'
win:
  target: nsis
  icon: assets/VERT_Q-256.png
electronVersion: 39.8.5
